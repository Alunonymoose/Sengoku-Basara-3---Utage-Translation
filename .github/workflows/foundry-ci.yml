name: Foundry CI

on:
  push:
    branches: [ foundry-v0.1 ]
    paths:
      - 'project/Foundry/**'
      - '.github/workflows/foundry-ci.yml'
  pull_request:
    paths:
      - 'project/Foundry/**'
      - '.github/workflows/foundry-ci.yml'

concurrency:
  group: foundry-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-and-smoke:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: project/Foundry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Toolchain
        run: dotnet --info
      - name: Build core
        run: dotnet build src/BasaraFoundry.Game.Utage/BasaraFoundry.Game.Utage.csproj -c Release
      - name: Build isolated worker
        run: dotnet build src/BasaraFoundry.Worker/BasaraFoundry.Worker.csproj -c Release
      - name: Run smoke tests
        run: dotnet run --project tests/BasaraFoundry.SmokeTests/BasaraFoundry.SmokeTests.csproj -c Release
      - name: Run preview safety smoke tests
        run: dotnet run --project tests/BasaraFoundry.PreviewSmokeTests/BasaraFoundry.PreviewSmokeTests.csproj -c Release
      - name: Run reference matching smoke tests
        run: dotnet run --project tests/BasaraFoundry.ReferenceSmokeTests/BasaraFoundry.ReferenceSmokeTests.csproj -c Release
      - name: Run BC3 round-trip smoke tests
        run: dotnet run --project tests/BasaraFoundry.RoundTripSmokeTests/BasaraFoundry.RoundTripSmokeTests.csproj -c Release
      - name: Run route resolution smoke tests
        run: dotnet run --project tests/BasaraFoundry.RouteSmokeTests/BasaraFoundry.RouteSmokeTests.csproj -c Release
      - name: Run BC3 block-graft smoke tests
        run: dotnet run --project tests/BasaraFoundry.GraftSmokeTests/BasaraFoundry.GraftSmokeTests.csproj -c Release
      - name: Run runtime evidence smoke tests
        run: dotnet run --project tests/BasaraFoundry.RuntimeEvidenceSmokeTests/BasaraFoundry.RuntimeEvidenceSmokeTests.csproj -c Release

  winui-alpha:
    needs: core-and-smoke
    runs-on: windows-latest
    defaults:
      run:
        working-directory: project/Foundry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained WinUI alpha
        run: dotnet publish src/BasaraFoundry.App/BasaraFoundry.App.csproj -c Release -r win-x64 --self-contained true -o out/Foundry-win-x64
      - name: Publish isolated indexing worker
        run: dotnet publish src/BasaraFoundry.Worker/BasaraFoundry.Worker.csproj -c Release -r win-x64 --self-contained true -o out/Foundry-win-x64/worker
      - name: Write build provenance
        shell: pwsh
        run: |
          $manifest = @{
            name = 'BASARA Foundry'
            channel = 'foundry-v0.1'
            git_commit = '${{ github.sha }}'
            run_number = '${{ github.run_number }}'
            target = 'win-x64'
            framework = 'net10.0'
            windows_app_sdk = '2.4.0'
            worker = 'worker/BasaraFoundry.Worker.exe'
          } | ConvertTo-Json
          Set-Content -Path 'out/Foundry-win-x64/FOUNDry_BUILD.json' -Value $manifest -Encoding utf8
      - name: Launch-test published GUI
        shell: pwsh
        run: |
          $startupLog = Join-Path $env:LOCALAPPDATA 'BASARA Foundry\startup.log'
          Remove-Item $startupLog -Force -ErrorAction SilentlyContinue
          $exe = (Resolve-Path 'out/Foundry-win-x64/BasaraFoundry.exe').Path
          $work = (Resolve-Path 'out/Foundry-win-x64').Path
          $process = Start-Process -FilePath $exe -WorkingDirectory $work -PassThru
          $activated = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Milliseconds 500
            $process.Refresh()
            if ($process.HasExited) {
              Write-Host "Foundry exited during launch smoke test with code $($process.ExitCode)."
              if (Test-Path $startupLog) { Get-Content $startupLog }
              exit 1
            }
            if (Test-Path $startupLog) {
              $text = Get-Content $startupLog -Raw
              if ($text -match 'MainWindow activated successfully') {
                $activated = $true
                break
              }
            }
          }
          if (-not $activated) {
            Write-Host 'Foundry stayed alive but did not prove MainWindow activation.'
            if (Test-Path $startupLog) { Get-Content $startupLog }
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Get-Content $startupLog
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
      - name: Build one-file BASARA Foundry launcher
        shell: pwsh
        run: |
          $payload = Join-Path $PWD 'out/BasaraFoundry-payload.zip'
          Compress-Archive -Path 'out/Foundry-win-x64/*' -DestinationPath $payload -CompressionLevel Optimal -Force
          $payload = (Resolve-Path $payload).Path
          dotnet publish src/BasaraFoundry.Bootstrap/BasaraFoundry.Bootstrap.csproj -c Release -r win-x64 --self-contained true -o out/onefile "-p:FoundryPayloadZip=$payload"
          if (-not (Test-Path 'out/onefile/BasaraFoundry.exe')) { throw 'One-file launcher was not produced.' }
      - uses: actions/upload-artifact@v4
        with:
          name: BasaraFoundry-win-x64-${{ github.run_number }}
          path: project/Foundry/out/Foundry-win-x64/**
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: BasaraFoundry-onefile-${{ github.run_number }}
          path: project/Foundry/out/onefile/BasaraFoundry.exe
          if-no-files-found: error
          retention-days: 14
