name: Alrummi3 Windows Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'project/Alrummi3/**'
      - '.github/workflows/alrummi3-windows-build.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: project/Alrummi3/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r project/Alrummi3/requirements.txt pyinstaller

      - name: Run Drive factory safety checks
        working-directory: project/Alrummi3
        run: python drive_factory_selftest.py

      - name: Run v31 bridge installer checks
        working-directory: project/Alrummi3
        run: python install_v31_drive_bridge_selftest.py

      - name: Build Alrummi3
        shell: pwsh
        working-directory: project/Alrummi3
        run: ./Build_Alrummi3.ps1

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = 'project/Alrummi3/dist/Alrummi3.exe'
          if (!(Test-Path -LiteralPath $exe)) { throw 'Alrummi3.exe was not produced' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash
          $size = (Get-Item -LiteralPath $exe).Length
          "SHA256=$hash" | Out-File -Encoding ascii project/Alrummi3/dist/BUILD_INFO.txt
          "SIZE=$size" | Out-File -Encoding ascii -Append project/Alrummi3/dist/BUILD_INFO.txt
          "COMMIT=${{ github.sha }}" | Out-File -Encoding ascii -Append project/Alrummi3/dist/BUILD_INFO.txt
          Get-Content project/Alrummi3/dist/BUILD_INFO.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Alrummi3-Windows
          path: |
            project/Alrummi3/dist/Alrummi3.exe
            project/Alrummi3/dist/BUILD_INFO.txt
            project/Alrummi3/dist/project_data/**
            project/Alrummi3/dist/ai_extensions/**
            project/Alrummi3/dist/updates/**
          if-no-files-found: error
          retention-days: 30
