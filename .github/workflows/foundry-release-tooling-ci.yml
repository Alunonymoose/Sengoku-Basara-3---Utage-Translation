name: Foundry Release Tooling CI

on:
  push:
    branches: [ foundry-v0.1, foundry-v0.2-orchestration ]
    paths:
      - 'project/orchestration/**'
      - 'project/tools/release_audit_2026-09-24/**'
      - 'project/tools/donor_matcher_v5_1_2026-09-23/**'
      - 'project/tools/resource_ownership_2026-09-23/**'
      - 'project/texture_tools/xet_recovery_2026-09-23/**'
      - 'project/dialogue_tools/fim_contract_recovery_2026-09-20/**'
      - 'project/terminology/**'
      - 'project/runtime/**'
      - '.github/workflows/foundry-release-tooling-ci.yml'
  pull_request:
    paths:
      - 'project/orchestration/**'
      - 'project/tools/release_audit_2026-09-24/**'
      - 'project/tools/donor_matcher_v5_1_2026-09-23/**'
      - 'project/tools/resource_ownership_2026-09-23/**'
      - 'project/texture_tools/xet_recovery_2026-09-23/**'
      - 'project/dialogue_tools/fim_contract_recovery_2026-09-20/**'
      - 'project/terminology/**'
      - 'project/runtime/**'
      - '.github/workflows/foundry-release-tooling-ci.yml'

concurrency:
  group: foundry-release-tooling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-tooling-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile release tooling
        shell: bash
        run: |
          python -m py_compile \
            project/tools/release_audit_2026-09-24/foundry_release_audit.py \
            project/tools/release_audit_2026-09-24/message_census.py \
            project/tools/release_audit_2026-09-24/media_census.py \
            project/tools/release_audit_2026-09-24/platform_census.py \
            project/tools/release_audit_2026-09-24/font_contract_census.py \
            project/tools/release_audit_2026-09-24/layout_census.py \
            project/tools/release_audit_2026-09-24/texture_review_export.py \
            project/tools/release_audit_2026-09-24/compare_audits.py \
            project/tools/release_audit_2026-09-24/test_release_audit.py \
            project/terminology/validate_terminology.py \
            project/runtime/validate_runtime_matrix.py \
            project/tools/donor_matcher_v5_1_2026-09-23/utage_donor_matcher_v5.py \
            project/tools/donor_matcher_v5_1_2026-09-23/safe_arc.py \
            project/tools/resource_ownership_2026-09-23/basara_resource_ownership.py \
            project/texture_tools/xet_recovery_2026-09-23/foundry_xet_decoder_20260923.py \
            project/dialogue_tools/fim_contract_recovery_2026-09-20/FIM_CONTRACT_REPAIR.py

      - name: Install Python test dependency
        run: python -m pip install pytest

      - name: Run Donor Matcher V5.1 suite against real safe_arc
        env:
          PYTHONPATH: project/tools/donor_matcher_v5_1_2026-09-23
        run: python -m pytest project/tools/donor_matcher_v5_1_2026-09-23/test_utage_donor_matcher_v5.py -q

      - name: Run release-audit unit tests
        run: python -m unittest project/tools/release_audit_2026-09-24/test_release_audit.py -v

      - name: Re-certify Donor Matcher V5.1 against the real committed safe_arc
        shell: bash
        run: |
          PYTHONPATH=project/tools/donor_matcher_v5_1_2026-09-23 \
            python -m pytest \
            project/tools/donor_matcher_v5_1_2026-09-23/test_utage_donor_matcher_v5.py \
            -q

      - name: Verify Donor Matcher package hash manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('project/tools/donor_matcher_v5_1_2026-09-23')
          manifest=json.loads((root/'SHA256SUMS.json').read_text())
          mismatches=[]
          for name, expected in manifest.items():
              p=root/name
              if not p.is_file():
                  mismatches.append((name, expected, 'MISSING', {}))
                  continue
              data=p.read_bytes()
              candidates={'raw':hashlib.sha256(data).hexdigest()}
              try:
                  text=data.decode('utf-8')
                  normalized=text.replace('\r\n','\n').replace('\r','\n')
                  candidates['utf8_lf']=hashlib.sha256(normalized.encode('utf-8')).hexdigest()
                  candidates['utf8_crlf']=hashlib.sha256(normalized.replace('\n','\r\n').encode('utf-8')).hexdigest()
              except UnicodeDecodeError:
                  pass
              if expected not in candidates.values():
                  mismatches.append((name, expected, candidates['raw'], candidates))
          if mismatches:
              for name, expected, actual, candidates in mismatches:
                  print(f'hash mismatch {name}: expected={expected} actual={actual} candidates={candidates}')
              raise SystemExit(1)
          print(f'verified {len(manifest)} V5.1 package hashes (raw or newline-equivalent text)')
          PY

      - name: Validate texture-review PNG encoder and PowerShell launcher syntax
        shell: pwsh
        run: |
          $script = Get-Content 'project/tools/release_audit_2026-09-24/run_release_audit.ps1' -Raw
          [scriptblock]::Create($script) | Out-Null
          python -c "import importlib.util, pathlib, struct, zlib; p=pathlib.Path('project/tools/release_audit_2026-09-24/texture_review_export.py'); s=importlib.util.spec_from_file_location('trev',p); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); b=m.rgba_png(1,1,bytes([1,2,3,4])); assert b[:8]==b'\x89PNG\r\n\x1a\n'; assert b'IEND' in b"

      - name: Execute fail-closed auditor end-to-end on synthetic roots
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/utage-live/PS3_GAME/USRDIR
          mkdir -p /tmp/samurai-heroes/PS3_GAME/USRDIR
          printf 'synthetic-eboot' > /tmp/utage-live/PS3_GAME/USRDIR/EBOOT.BIN
          set +e
          python project/tools/release_audit_2026-09-24/foundry_release_audit.py \
            /tmp/utage-live \
            --sh-root /tmp/samurai-heroes \
            --out /tmp/basara-audit
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Expected engineering-incomplete exit 1; got $code"
            exit 1
          fi
          required=(
            00_RUN_METADATA.json
            FILE_TREE_HASHES.json
            ARC_MEMBERS.json
            RESOURCE_OWNERSHIP.json
            TEXTURE_CENSUS.json
            MESSAGE_CENSUS.json
            MEDIA_CENSUS.json
            LOOSE_UI_AND_METADATA_CENSUS.json
            DONOR_CANDIDATES.json
            TERMINOLOGY_STATUS.json
            FONT_CONTRACT_CENSUS.json
            LAYOUT_CENSUS.json
            LAYOUT_NODES.csv
            RUNTIME_ACCEPTANCE_MATRIX.json
            RUNTIME_ACCEPTANCE_STATUS.json
            UNRESOLVED.json
            SHA256SUMS.json
          )
          for name in "${required[@]}"; do
            if [ ! -f "/tmp/basara-audit/$name" ]; then
              echo "MISSING REQUIRED AUDIT OUTPUT: $name"
              echo "--- directory listing ---"
              find /tmp/basara-audit -maxdepth 2 -type f -printf '%P\n' | sort
              echo "--- unresolved ---"
              cat /tmp/basara-audit/UNRESOLVED.json || true
              exit 1
            fi
          done
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/basara-audit')
          meta=json.loads((p/'00_RUN_METADATA.json').read_text())
          assert meta['release_pass'] is False
          assert meta['status']=='ENGINEERING_INCOMPLETE'
          assert meta['live_tree_sha256']
          unresolved=json.loads((p/'UNRESOLVED.json').read_text())
          assert unresolved['count'] > 0
          runtime=json.loads((p/'RUNTIME_ACCEPTANCE_STATUS.json').read_text())
          assert runtime['release_ready'] is False
          PY

      - name: Execute auditor through Foundry v0.2 snapshot binding
        shell: bash
        run: |
          set -e
          rm -rf /tmp/utage-snapshot /tmp/basara-snapshot-audit
          mkdir -p /tmp/utage-snapshot/PS3_GAME/USRDIR
          printf 'synthetic-eboot' > /tmp/utage-snapshot/PS3_GAME/USRDIR/EBOOT.BIN
          python project/orchestration/foundry.py snapshot /tmp/utage-snapshot --git-commit "${{ github.sha }}"
          set +e
          python project/tools/release_audit_2026-09-24/foundry_release_audit.py \
            /tmp/utage-snapshot \
            --snapshot /tmp/utage-snapshot \
            --sh-root /tmp/samurai-heroes \
            --out /tmp/basara-snapshot-audit
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Expected engineering-incomplete exit 1 through snapshot path; got $code"
            cat /tmp/basara-snapshot-audit/00_RUN_METADATA.json || true
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/basara-snapshot-audit')
          meta=json.loads((p/'00_RUN_METADATA.json').read_text())
          assert meta['snapshot_id']
          assert meta['snapshot_id']==meta['live_tree_sha256']
          assert meta['snapshot_verification']['match'] is True
          assert (p/'RESOURCE_OWNERSHIP.json').is_file()
          assert (p/'_ownership_stage'/'resources.csv').is_file()
          PY

      - name: Validate terminology ledger structure
        run: |
          python project/terminology/validate_terminology.py \
            project/terminology/canonical_english_terminology_2026-09-24.json

      - name: Prove terminology release gate is still fail-closed
        shell: bash
        run: |
          set +e
          python project/terminology/validate_terminology.py \
            project/terminology/canonical_english_terminology_2026-09-24.json \
            --release-gate
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Expected terminology release gate exit 1 while editorial blockers remain; got $code"
            exit 1
          fi

      - name: Prove runtime template cannot pass without final-build binding
        shell: bash
        run: |
          set +e
          python project/runtime/validate_runtime_matrix.py \
            project/runtime/runtime_acceptance_matrix_2026-09-24.json
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "Expected runtime template validation exit 2 before candidate hashes/evidence are bound; got $code"
            exit 1
          fi
