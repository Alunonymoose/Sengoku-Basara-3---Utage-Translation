name: Foundry Core

on:
  push:
    branches:
      - "foundry-*"
      - main
  pull_request:
  workflow_dispatch:

jobs:
  python-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile public-safe Foundry tools
        shell: pwsh
        run: |
          python -m py_compile project/Foundry/tools/foundry_graph.py
          python -m py_compile project/Foundry/tools/foundry.py
          python -m py_compile project/Foundry/tools/texture_triage.py
          python -m py_compile project/Foundry/tools/texture_ocr_triage.py
          python -m py_compile project/Foundry/tools/runtime_bind.py
          python -m py_compile project/Foundry/tools/runtime_record.py
          python -m py_compile project/Foundry/tools/doctor.py
          python -m py_compile project/Foundry/tools/next_work.py
          python -m py_compile project/Foundry/tools/change_impact.py
          python -m py_compile project/Foundry/tools/determinism_guard.py
          python -m py_compile project/Foundry/tools/translation_memory.py
          python -m py_compile project/Foundry/tools/oracle_audit.py
          python -m py_compile project/Foundry/tools/dashboard.py
          python -m py_compile project/tools/arc_texture_gallery.py

      - name: Public Foundry regression tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "project/Foundry/tools"
          python -m unittest discover -s project/Foundry/tests -p "test_*.py" -v
